<!doctype html>
<html lang="da">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Siden blev ikke fundet — Yderskov Arkitekter</title>
	<meta name="robots" content="noindex, follow" />
	<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body {
			font-family: 'Inter Variable', Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
			background: #ffffff;
		}
		.topbar {
			position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
			background: rgba(255,255,255,0.92); border-radius: 12px; padding: 10px 22px;
			display: flex; align-items: center; gap: 2rem; z-index: 5;
			box-shadow: 0 2px 24px rgba(0,0,0,0.09), 0 0 0 1px rgba(0,0,0,0.06);
		}
		.topbar img { height: 26px; display: block; }
		.topbar a { color: #6b6b67; text-decoration: none; font-size: 0.8rem; }
		.topbar a:hover { color: #1a1a18; }
		.wrap {
			position: relative; min-height: 100vh; display: flex; align-items: center;
			justify-content: center; padding: 4rem 2rem;
			background-image: url('/images/Gjøl/Gjøl-ny-villa-have.webp');
			background-size: cover; background-position: center;
		}
		.overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.45); backdrop-filter: blur(2px); z-index: 1; }
		.card {
			position: relative; z-index: 2; max-width: 560px; width: 100%;
			background: rgba(22,22,22,0.88); backdrop-filter: blur(12px);
			border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
			padding: 3rem 2.5rem; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
		}
		.badge {
			display: inline-flex; align-items: center; justify-content: center;
			width: 64px; height: 64px; border-radius: 50%;
			background: rgba(184,124,8,0.15); color: #d4910a; margin-bottom: 1.5rem;
			border: 1px solid rgba(212,145,10,0.3);
		}
		.eyebrow { display: block; color: #d4910a; letter-spacing: 0.15em; font-size: 0.8rem; text-transform: uppercase; font-weight: 500; }
		h1 { font-size: clamp(1.8rem, 4vw, 2.5rem); margin: 0.75rem 0 1.25rem 0; font-weight: 300; color: #ffffff; letter-spacing: -0.01em; }
		p.lead { margin-bottom: 2.5rem; color: rgba(255,255,255,0.7); font-size: 0.88rem; line-height: 1.6; font-weight: 300; }
		.links { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; }
		.links a { padding: 0.8rem 1.4rem; border-radius: 8px; text-decoration: none; font-size: 0.85rem; font-weight: 400; }
		.links a.primary { background: #d4910a; color: #ffffff; border: 1px solid #d4910a; }
		.links a.ghost { background: rgba(255,255,255,0.08); color: #ffffff; border: 1px solid rgba(255,255,255,0.15); }
	</style>
</head>
<body>
	<div class="topbar">
		<a href="/"><img src="/images/logofiles/SVG/Arkitect 5icon.svg" alt="Arkitekttegnestuen Yderskov" /></a>
		<a href="/villaer/">Villaer</a>
		<a href="/sommerhuse/">Sommerhuse</a>
		<a href="/priser/">Priser</a>
		<a href="/kontakt/">Kontakt</a>
	</div>
	<div class="wrap">
		<div class="overlay"></div>
		<div class="card">
			<div class="badge">
				<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<circle cx="12" cy="12" r="10" />
					<line x1="12" y1="8" x2="12" y2="12" />
					<line x1="12" y1="16" x2="12.01" y2="16" />
				</svg>
			</div>
			<span class="eyebrow">Fejl 404</span>
			<h1>Siden blev ikke fundet</h1>
			<p class="lead">
				Beklager, men den side du leder efter findes desværre ikke. Den kan være flyttet, eller linket kan være forældet.
			</p>
			<div class="links">
				<a class="primary" href="/">Gå til forsiden</a>
				<a class="ghost" href="/sommerhuse/">Se sommerhuse</a>
				<a class="ghost" href="/prisberegner/">Prisberegner</a>
				<a class="ghost" href="/kontakt/">Book gratis møde</a>
			</div>
		</div>
	</div>
</body>
</html>
